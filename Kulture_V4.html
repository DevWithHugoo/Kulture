    // ─── COMPONENTS ───────────────────────────────────────────────────────────────
    function Block({ label, color, children, C }) {
      return (
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: "16px", marginBottom: 12 }}>
          <div style={{ fontSize: "0.65rem", fontWeight: 600, color, letterSpacing: 1, marginBottom: 8 }}>{label}</div>
          <p style={{ fontSize: "0.84rem", color: C.textSub, lineHeight: 1.7, margin: 0 }}>{children}</p>
        </div>
      );
    }

    function TopBar({ onBack, progress, total, lives, C }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 28 }}>
          <button onClick={onBack} style={{ background: "none", border: "none", color: C.textMuted, fontSize: "1.1rem", cursor: "pointer", padding: "4px 8px 4px 0", fontFamily: "'DM Sans'" }}>←</button>
          <div style={{ flex: 1, height: 3, background: C.border, borderRadius: 999 }}>
            <div style={{ width: `${(progress / total) * 100}%`, height: "100%", background: C.blue, borderRadius: 999, transition: "width 0.4s ease" }} />
          </div>
          <div style={{ display: "flex", gap: 3 }}>
            {[...Array(3)].map((_, i) => (
              <span key={i} style={{ fontSize: "0.85rem", opacity: i < lives ? 1 : 0.2, transition: "opacity 0.3s" }}>♥</span>
            ))}
          </div>
        </div>
      );
    }

        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.bg, borderTop: `1px solid ${C.border}`, display: "flex", justifyContent: "space-around", padding: "14px 0 22px" }}>
          {[["Accueil", "home", "○"], ["Cours", "courses", "◈"], ["Profil", "profile", "◇"]].map(([label, s, icon]) => (
            <div key={s} onClick={() => setScreen(s)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 5, cursor: "pointer", opacity: screen === s ? 1 : 0.3, transition: "opacity 0.2s" }}>
              <span style={{ fontSize: "1rem", color: screen === s ? C.blue : C.textMuted }}>{icon}</span>
              <span style={{ fontSize: "0.62rem", fontWeight: 600, color: screen === s ? C.blue : C.textMuted, letterSpacing: 0.5 }}>{label}</span>
            </div>
          ))}
        </div>
      );
    }

    function btnStyle(color) {
      return { width: "100%", padding: "15px", borderRadius: 13, border: "none", background: color, color: "#fff", fontWeight: 600, fontSize: "0.9rem", cursor: "pointer", transition: "all 0.2s", fontFamily: "'DM Sans'" };
    }

    // ─── MAIN APP ─────────────────────────────────────────────────────────────────
    function Kulture() {
      const [darkMode, setDarkMode] = useState(false);
      const C = darkMode ? DARK : LIGHT;

      const [screen, setScreen] = useState("home");
      const [courseSection, setCourseSection] = useState("art");
      const [moduleView, setModuleView] = useState(null);
      const [moduleMode, setModuleMode] = useState("sheet");

      const [lesson, setLesson] = useState(null);
      const [step, setStep] = useState(0);
      const [selected, setSelected] = useState(null);
      const [showExp, setShowExp] = useState(false);
      const [lives, setLives] = useState(3);
      const [answers, setAnswers] = useState([]);
      const [earnedXP, setEarnedXP] = useState(0);
      const [showContent, setShowContent] = useState(true);

      const [modStep, setModStep] = useState(0);
      const [modSelected, setModSelected] = useState(null);
      const [modShowExp, setModShowExp] = useState(false);
      const [modLives, setModLives] = useState(3);
      const [modAnswers, setModAnswers] = useState([]);

      const STORAGE_KEY = 'kulture_progress';

      const [stats, setStats] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return { totalXP: 0, streak: 0, lessonsCompleted: 0, perfectLessons: 0, completedLessons: [], completedModules: [] };
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
        } catch(e) {}
      }, [stats]);

      const [showSettings, setShowSettings] = useState(false);

      const resetProgress = () => {
        const empty = { totalXP: 0, streak: 0, lessonsCompleted: 0, perfectLessons: 0, completedLessons: [], completedModules: [] };
        setStats(empty);
        try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
        setShowSettings(false);
      };

      const done = (id) => stats.completedLessons.includes(id);
      const moduleDone = (id) => (stats.completedModules || []).includes(id);

      const startLesson = (l) => {
        setLesson(l); setStep(0); setSelected(null); setShowExp(false);
        setLives(3); setAnswers([]); setEarnedXP(0); setShowContent(true);
        setScreen("lesson");
      };

      const startModule = (mod, mode) => {
        setModuleView(mod);
        setModuleMode(mode);
        if (mode === "quiz") {
          setModStep(0); setModSelected(null); setModShowExp(false);
          setModLives(3); setModAnswers([]);
        }
        setScreen("module");
      };

      const handleAnswer = (idx) => {
        if (showExp) return;
        setSelected(idx); setShowExp(true);
        const correct = idx === lesson.questions[step].answer;
        setAnswers((prev) => [...prev, correct]);
        if (!correct) setLives((l) => Math.max(0, l - 1));
      };

      const handleModAnswer = (idx) => {
        if (modShowExp) return;
        setModSelected(idx); setModShowExp(true);
        const correct = idx === moduleView.questions[modStep].answer;
        setModAnswers((prev) => [...prev, correct]);
        if (!correct) setModLives((l) => Math.max(0, l - 1));
      };

      const next = () => {
        const isLast = step + 1 >= lesson.questions.length;
        if (isLast) {
          const total = [...answers, selected === lesson.questions[step].answer].filter(Boolean).length;
          const xp = Math.round((total / lesson.questions.length) * lesson.xp);
          setEarnedXP(xp);
          setStats((prev) => ({
            ...prev, totalXP: prev.totalXP + xp,
            lessonsCompleted: done(lesson.id) ? prev.lessonsCompleted : prev.lessonsCompleted + 1,
            perfectLessons: total === lesson.questions.length ? prev.perfectLessons + 1 : prev.perfectLessons,
            completedLessons: done(lesson.id) ? prev.completedLessons : [...prev.completedLessons, lesson.id],
          }));
          setScreen("result");
        } else {
          setStep((s) => s + 1); setSelected(null); setShowExp(false);
        }
      };

      const nextMod = () => {
        const isLast = modStep + 1 >= moduleView.questions.length;
        if (isLast) {
          const total = modAnswers.filter(Boolean).length;
          const xp = Math.round((total / moduleView.questions.length) * 80);
          setStats((prev) => ({
            ...prev, totalXP: prev.totalXP + xp,
            perfectLessons: total === moduleView.questions.length ? prev.perfectLessons + 1 : prev.perfectLessons,
            completedModules: moduleDone(moduleView.id) ? prev.completedModules : [...(prev.completedModules || []), moduleView.id],
          }));
          setScreen("modresult");
        } else {
          setModStep((s) => s + 1); setModSelected(null); setModShowExp(false);
        }
      };

      const correctTotal = [...answers, selected === (lesson?.questions[step]?.answer)].filter(Boolean).length;
      const modCorrectTotal = modAnswers.filter(Boolean).length;

      return (
        <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "'DM Sans', 'Segoe UI', sans-serif" }}>

          {/* ── HOME ── */}
          {screen === "home" && (
            <div style={{ maxWidth: 440, margin: "0 auto", padding: "32px 20px 90px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 40 }}>
                <div>
                  <div style={{ fontSize: "1.3rem", fontWeight: 700, letterSpacing: "-0.5px" }}>Kulture</div>
                  <div style={{ fontSize: "0.73rem", color: C.textMuted, marginTop: 3 }}>Culture générale, un concept à la fois</div>
                </div>
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <button onClick={() => setDarkMode(d => !d)} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "8px 12px", cursor: "pointer", fontSize: "0.75rem", color: C.blue, fontWeight: 600, fontFamily: "'DM Sans'", transition: "all 0.2s" }}>
                    {darkMode ? "☀️ Clair" : "🌙 Sombre"}
                  </button>
                  <div onClick={() => setScreen("profile")} className="card-hover" style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "10px 16px", textAlign: "right" }}>
                    <div style={{ fontSize: "0.6rem", color: C.textMuted, fontWeight: 500, letterSpacing: 0.5 }}>XP</div>
                    <div style={{ fontSize: "1rem", fontWeight: 700, color: C.gold, fontFamily: "'DM Mono'", marginTop: 1 }}>{stats.totalXP}</div>
                  </div>
                </div>
              </div>

              <div style={{ fontSize: "0.65rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 14 }}>Cours complets</div>
              <div style={{ display: "flex", gap: 10, marginBottom: 28 }}>
                {[
                  { key: "art", label: "Art & Culture", emoji: "🎨", color: "#1B4FD8", desc: "10 modules" },
                  { key: "histoire", label: "Histoire", emoji: "🏛️", color: "#0EA672", desc: "10 modules" }
                ].map(c => (
                  <div key={c.key} className="card-hover" onClick={() => { setCourseSection(c.key); setScreen("courses"); }} style={{ flex: 1, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 16, padding: "18px 14px", animation: "fadeUp 0.3s ease" }}>
                    <div style={{ fontSize: "1.6rem", marginBottom: 10 }}>{c.emoji}</div>
                    <div style={{ fontWeight: 700, fontSize: "0.85rem", marginBottom: 4 }}>{c.label}</div>
                    <div style={{ fontSize: "0.7rem", color: C.textMuted }}>{c.desc}</div>
                    <div style={{ marginTop: 10, fontSize: "0.65rem", color: c.color, fontWeight: 600 }}>Explorer →</div>
                  </div>
                ))}
              </div>

              <div style={{ fontSize: "0.65rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 14 }}>Leçons rapides</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {[ART_MODULES.find(mod => !moduleDone(mod.id)), HISTORY_MODULES.find(mod => !moduleDone(mod.id))].filter(Boolean).map((mod, i) => (
                  <div key={mod.id} className="card-hover" onClick={() => startModule(mod, "sheet")} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 16, padding: "18px 20px", animation: `fadeUp ${0.2 + i * 0.07}s ease` }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                      <div style={{ width: 42, height: 42, borderRadius: 11, background: mod.tag === "ART" ? C.blueDim : C.successDim, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "1.2rem", flexShrink: 0 }}>{mod.emoji}</div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                          <span style={{ fontWeight: 600, fontSize: "0.9rem" }}>{mod.title}</span>
                          <span style={{ fontSize: "0.58rem", fontWeight: 600, color: mod.tag === "ART" ? C.blue : C.success, background: mod.tag === "ART" ? C.blueDim : C.successDim, padding: "2px 7px", borderRadius: 999, letterSpacing: 0.5 }}>{mod.tag}</span>
                        </div>
                        <div style={{ fontSize: "0.73rem", color: C.textMuted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{mod.definition.slice(0, 60)}…</div>
                      </div>
                      <div style={{ flexShrink: 0, textAlign: "right" }}>
                        <div style={{ fontSize: "0.72rem", color: C.blue, fontWeight: 600, fontFamily: "'DM Mono'" }}>+80</div>
                        <div style={{ fontSize: "0.6rem", color: C.textMuted, marginTop: 1 }}>XP</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              <BottomNav screen={screen} setScreen={setScreen} C={C} />
            </div>
          )}

          {/* ── COURSES LIST ── */}
          {screen === "courses" && (
            <div style={{ maxWidth: 440, margin: "0 auto", padding: "28px 20px 90px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
                <button onClick={() => setScreen("home")} style={{ background: "none", border: "none", color: C.textMuted, fontSize: "1.1rem", cursor: "pointer", fontFamily: "'DM Sans'" }}>←</button>
                <div>
                  <div style={{ fontWeight: 700, fontSize: "1.05rem" }}>{courseSection === "art" ? "🎨 Art & Culture" : "🏛️ Histoire"}</div>
                  <div style={{ fontSize: "0.7rem", color: C.textMuted, marginTop: 2 }}>10 modules · Fiches + QCM</div>
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
                {["art", "histoire"].map(s => (
                  <button key={s} onClick={() => setCourseSection(s)} style={{ padding: "7px 16px", borderRadius: 999, border: `1px solid ${courseSection === s ? C.blue : C.border}`, background: courseSection === s ? C.blueDim : "transparent", color: courseSection === s ? C.blue : C.textMuted, fontSize: "0.75rem", fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans'" }}>{s === "art" ? "🎨 Art & Culture" : "🏛️ Histoire"}</button>
                ))}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {(courseSection === "art" ? ART_MODULES : HISTORY_MODULES).map((mod, i) => {
                  const isDone = moduleDone(mod.id);
                  return (
                    <div key={mod.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 16, padding: "16px 18px", animation: `fadeUp ${0.15 + i * 0.05}s ease` }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
                        <div style={{ width: 38, height: 38, borderRadius: 10, background: C.blueDim, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "1.1rem", flexShrink: 0 }}>{mod.emoji}</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                            <span style={{ fontWeight: 600, fontSize: "0.87rem" }}>{mod.title}</span>
                            {isDone && <span style={{ fontSize: "0.55rem", fontWeight: 600, color: C.success, background: C.successDim, padding: "2px 6px", borderRadius: 999 }}>FAIT</span>}
                          </div>
                          <div style={{ fontSize: "0.68rem", color: C.textMuted, marginTop: 2, lineHeight: 1.4 }}>{mod.definition.slice(0, 60)}…</div>
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => startModule(mod, "sheet")} style={{ flex: 1, padding: "9px", borderRadius: 10, border: `1px solid ${C.border}`, background: "transparent", color: C.textSub, fontWeight: 600, fontSize: "0.75rem", cursor: "pointer", fontFamily: "'DM Sans'" }}>📖 Fiche cours</button>
                        <button onClick={() => startModule(mod, "quiz")} style={{ flex: 1, padding: "9px", borderRadius: 10, border: "none", background: C.blue, color: "#fff", fontWeight: 600, fontSize: "0.75rem", cursor: "pointer", fontFamily: "'DM Sans'" }}>✏️ QCM</button>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{ marginTop: 24, marginBottom: 8, textAlign: "center" }}>
                <span style={{ fontSize: "0.62rem", color: C.textMuted, fontWeight: 400, letterSpacing: 0.3 }}>
                  ✦ Contenu des cours généré par IA
                </span>
              </div>
              <BottomNav screen={screen} setScreen={setScreen} C={C} />
            </div>
          )}

          {/* ── MODULE SHEET ── */}
          {screen === "module" && moduleView && moduleMode === "sheet" && (
            <div style={{ maxWidth: 440, margin: "0 auto", padding: "28px 20px 40px", animation: "fadeUp 0.3s ease" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
                <button onClick={() => setScreen("courses")} style={{ background: "none", border: "none", color: C.textMuted, fontSize: "1.1rem", cursor: "pointer", fontFamily: "'DM Sans'" }}>←</button>
                <span style={{ fontSize: "0.63rem", fontWeight: 600, color: C.blue, letterSpacing: 1 }}>{moduleView.tag}</span>
              </div>
              <div style={{ fontSize: "2rem", marginBottom: 10 }}>{moduleView.emoji}</div>
              <div style={{ fontSize: "1.4rem", fontWeight: 700, letterSpacing: "-0.3px", marginBottom: 20 }}>{moduleView.title}</div>
              <div style={{ background: C.blueDim, border: `1px solid ${C.blueBorder}`, borderRadius: 14, padding: "14px 16px", marginBottom: 14 }}>
                <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.blue, letterSpacing: 1, marginBottom: 6 }}>DÉFINITION</div>
                <p style={{ fontSize: "0.85rem", color: C.text, lineHeight: 1.65, margin: 0, fontWeight: 500 }}>{moduleView.definition}</p>
              </div>
              <Block label="EXPLICATION SIMPLE" color={C.textMuted} C={C}>{moduleView.explanation}</Block>
              <Block label="POUR ALLER PLUS LOIN" color={C.blue} C={C}>{moduleView.detail}</Block>
              <div style={{ background: C.goldDim, border: `1px solid rgba(201,168,76,0.2)`, borderRadius: 14, padding: "14px 16px", marginBottom: 28 }}>
                <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.gold, letterSpacing: 1, marginBottom: 6 }}>EXEMPLE CONCRET</div>
                <p style={{ fontSize: "0.82rem", color: C.textSub, lineHeight: 1.65, margin: 0 }}>{moduleView.example}</p>
              </div>
              <button className="btn" onClick={() => startModule(moduleView, "quiz")} style={btnStyle(C.blue)}>
                Tester ses connaissances (QCM)
              </button>
            </div>
          )}

          {/* ── MODULE QUIZ ── */}
          {screen === "module" && moduleView && moduleMode === "quiz" && (
            <div style={{ maxWidth: 440, margin: "0 auto", padding: "28px 20px 40px" }}>
              <TopBar onBack={() => setScreen("courses")} progress={modStep} total={moduleView.questions.length} lives={modLives} C={C} />
              <div key={modStep} style={{ animation: "fadeUp 0.3s ease" }}>
                <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1, marginBottom: 6 }}>{moduleView.title}</div>
                <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1, marginBottom: 14 }}>QUESTION {modStep + 1} / {moduleView.questions.length}</div>
                <div style={{ fontSize: "1rem", fontWeight: 600, lineHeight: 1.55, marginBottom: 26 }}>{moduleView.questions[modStep].q}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 9, marginBottom: 22 }}>
                  {moduleView.questions[modStep].options.map((opt, idx) => {
                    const isCorrect = idx === moduleView.questions[modStep].answer;
                    const isSelected = idx === modSelected;
                    let bg = C.surface, border = C.border, textColor = C.text;
                    if (modShowExp && isCorrect) { bg = C.successDim; border = C.success; textColor = C.success; }
                    if (modShowExp && isSelected && !isCorrect) { bg = C.errorDim; border = C.error; textColor = C.error; }
                    return (
                      <button key={idx} className={!modShowExp ? "ans-btn" : ""} onClick={() => handleModAnswer(idx)} style={{ background: bg, border: `1px solid ${border}`, borderRadius: 12, padding: "14px 15px", color: textColor, fontWeight: 500, fontSize: "0.85rem", cursor: modShowExp ? "default" : "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12, fontFamily: "'DM Sans'", transition: "all 0.15s" }}>
                        <span style={{ width: 22, height: 22, borderRadius: 6, flexShrink: 0, background: modShowExp && isCorrect ? "rgba(14,166,114,0.2)" : modShowExp && isSelected && !isCorrect ? "rgba(224,62,62,0.2)" : C.blueDim, color: modShowExp && isCorrect ? C.success : modShowExp && isSelected && !isCorrect ? C.error : C.blue, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "0.67rem", fontWeight: 700 }}>{String.fromCharCode(65 + idx)}</span>
                        {opt}
                      </button>
                    );
                  })}
                </div>
                {modShowExp && (
                  <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "13px 15px", marginBottom: 18, animation: "fadeIn 0.25s ease" }}>
                    <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1, marginBottom: 6 }}>EXPLICATION</div>
                    <p style={{ fontSize: "0.81rem", color: C.textSub, lineHeight: 1.65, margin: 0 }}>{moduleView.questions[modStep].explanation}</p>
                  </div>
                )}
                {modShowExp && (
                  <button className="btn" onClick={nextMod} style={{ ...btnStyle(C.blue), animation: "fadeUp 0.2s ease" }}>
                    {modStep + 1 >= moduleView.questions.length ? "Voir les résultats" : "Continuer"}
                  </button>
                )}
              </div>
            </div>
          )}

          {/* ── MODULE RESULT ── */}
          {screen === "modresult" && moduleView && (
            <div style={{ maxWidth: 440, margin: "0 auto", padding: "52px 20px 40px", textAlign: "center", animation: "scaleIn 0.35s ease" }}>
              <div style={{ fontSize: "2.8rem", marginBottom: 18 }}>
                {modCorrectTotal >= moduleView.questions.length ? "🏆" : modCorrectTotal >= 3 ? "⭐" : "💪"}
              </div>
              <div style={{ fontSize: "1.35rem", fontWeight: 700, marginBottom: 5 }}>
                {modCorrectTotal >= moduleView.questions.length ? "Parfait !" : modCorrectTotal >= 3 ? "Bien joué !" : "Continue d'apprendre"}
              </div>
              <div style={{ fontSize: "0.78rem", color: C.textMuted, marginBottom: 34 }}>{modCorrectTotal}/{moduleView.questions.length} bonnes réponses</div>
              <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 18, padding: "22px", marginBottom: 20 }}>
                <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1, marginBottom: 10 }}>XP GAGNÉ</div>
                <div style={{ fontSize: "2.6rem", fontWeight: 700, color: C.gold, fontFamily: "'DM Mono'" }}>+{Math.round((modCorrectTotal / moduleView.questions.length) * 80)}</div>
                <div style={{ fontSize: "0.7rem", color: C.textMuted, marginTop: 7 }}>Total : {stats.totalXP} XP</div>
              </div>
              <button className="btn" onClick={() => startModule(moduleView, "sheet")} style={{ ...btnStyle("transparent"), border: `1px solid ${C.border}`, color: C.textSub, marginBottom: 10 }}>Revoir la fiche</button>
              <button className="btn" onClick={() => setScreen("courses")} style={btnStyle(C.blue)}>Retour aux cours</button>
            </div>
          )}

          {/* ── LESSON CONTENT ── */}
          {screen === "lesson" && lesson && showContent && (
            <div style={{ maxWidth: 440, margin: "0 auto", padding: "28px 20px 40px", animation: "fadeUp 0.3s ease" }}>
              <TopBar onBack={() => setScreen("home")} progress={0} total={lesson.questions.length} lives={lives} C={C} />
              <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.blue, letterSpacing: 1.2, marginBottom: 8 }}>{lesson.tag}</div>
              <div style={{ fontSize: "1.45rem", fontWeight: 700, marginBottom: 6, letterSpacing: "-0.3px" }}>{lesson.title}</div>
              <div style={{ fontSize: "0.8rem", color: C.textMuted, marginBottom: 26 }}>{lesson.description}</div>
              <Block label="EN PRATIQUE" color={C.textMuted} C={C}>{lesson.content.story}</Block>
              <Block label="LE CONCEPT" color={C.blue} C={C}>{lesson.content.concept}</Block>
              <div style={{ background: C.goldDim, border: `1px solid rgba(201,168,76,0.15)`, borderRadius: 14, padding: "14px 16px", marginBottom: 32 }}>
                <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.gold, letterSpacing: 1, marginBottom: 6 }}>À RETENIR</div>
                <p style={{ fontSize: "0.82rem", color: C.textSub, lineHeight: 1.65, margin: 0 }}>{lesson.content.tip}</p>
              </div>
              <button className="btn" onClick={() => setShowContent(false)} style={btnStyle(C.blue)}>Commencer le quiz</button>
            </div>
          )}

          {/* ── LESSON QUIZ ── */}
          {screen === "lesson" && lesson && !showContent && (
            <div style={{ maxWidth: 440, margin: "0 auto", padding: "28px 20px 40px" }}>
              <TopBar onBack={() => setScreen("home")} progress={step} total={lesson.questions.length} lives={lives} C={C} />
              <div key={step} style={{ animation: "fadeUp 0.3s ease" }}>
                <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1, marginBottom: 14 }}>QUESTION {step + 1} / {lesson.questions.length}</div>
                <div style={{ fontSize: "1rem", fontWeight: 600, lineHeight: 1.55, marginBottom: 26 }}>{lesson.questions[step].q}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 9, marginBottom: 22 }}>
                  {lesson.questions[step].options.map((opt, idx) => {
                    const isCorrect = idx === lesson.questions[step].answer;
                    const isSelected = idx === selected;
                    let bg = C.surface, border = C.border, textColor = C.text;
                    if (showExp && isCorrect) { bg = C.successDim; border = C.success; textColor = C.success; }
                    if (showExp && isSelected && !isCorrect) { bg = C.errorDim; border = C.error; textColor = C.error; }
                    return (
                      <button key={idx} className={!showExp ? "ans-btn" : ""} onClick={() => handleAnswer(idx)} style={{ background: bg, border: `1px solid ${border}`, borderRadius: 12, padding: "14px 15px", color: textColor, fontWeight: 500, fontSize: "0.85rem", cursor: showExp ? "default" : "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12, fontFamily: "'DM Sans'", transition: "all 0.15s" }}>
                        <span style={{ width: 22, height: 22, borderRadius: 6, flexShrink: 0, background: showExp && isCorrect ? "rgba(14,166,114,0.2)" : showExp && isSelected && !isCorrect ? "rgba(224,62,62,0.2)" : C.blueDim, color: showExp && isCorrect ? C.success : showExp && isSelected && !isCorrect ? C.error : C.blue, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "0.67rem", fontWeight: 700 }}>{String.fromCharCode(65 + idx)}</span>
                        {opt}
                      </button>
                    );
                  })}
                </div>
                {showExp && (
                  <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "13px 15px", marginBottom: 18, animation: "fadeIn 0.25s ease" }}>
                    <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1, marginBottom: 6 }}>EXPLICATION</div>
                    <p style={{ fontSize: "0.81rem", color: C.textSub, lineHeight: 1.65, margin: 0 }}>{lesson.questions[step].explanation}</p>
                  </div>
                )}
                {showExp && (
                  <button className="btn" onClick={next} style={{ ...btnStyle(C.blue), animation: "fadeUp 0.2s ease" }}>
                    {step + 1 >= lesson.questions.length ? "Voir les résultats" : "Continuer"}
                  </button>
                )}
              </div>
            </div>
          )}

          {/* ── LESSON RESULT ── */}
          {screen === "result" && lesson && (
            <div style={{ maxWidth: 440, margin: "0 auto", padding: "52px 20px 40px", textAlign: "center", animation: "scaleIn 0.35s ease" }}>
              <div style={{ fontSize: "2.8rem", marginBottom: 18 }}>
                {correctTotal >= lesson.questions.length ? "🏆" : correctTotal >= 2 ? "⭐" : "💪"}
              </div>
              <div style={{ fontSize: "1.35rem", fontWeight: 700, marginBottom: 5 }}>
                {correctTotal >= lesson.questions.length ? "Parfait !" : correctTotal >= 2 ? "Bien joué !" : "Continue d'apprendre"}
              </div>
              <div style={{ fontSize: "0.78rem", color: C.textMuted, marginBottom: 34 }}>{correctTotal}/{lesson.questions.length} bonnes réponses</div>
              <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 18, padding: "22px", marginBottom: 12 }}>
                <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1, marginBottom: 10 }}>XP GAGNÉ</div>
                <div style={{ fontSize: "2.6rem", fontWeight: 700, color: C.gold, fontFamily: "'DM Mono'" }}>+{earnedXP}</div>
                <div style={{ fontSize: "0.7rem", color: C.textMuted, marginTop: 7 }}>Total : {stats.totalXP} XP</div>
              </div>
              <div style={{ display: "flex", gap: 10, marginBottom: 30 }}>
                {[{ label: "Réponses", value: `${correctTotal}/${lesson.questions.length}` }, { label: "Vies", value: `${lives}/3` }].map((s) => (
                  <div key={s.label} style={{ flex: 1, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 13, padding: "13px" }}>
                    <div style={{ fontSize: "1.1rem", fontWeight: 700 }}>{s.value}</div>
                    <div style={{ fontSize: "0.65rem", color: C.textMuted, marginTop: 4 }}>{s.label}</div>
                  </div>
                ))}
              </div>
              <button className="btn" onClick={() => setScreen("home")} style={{ ...btnStyle(C.blue), marginBottom: 10 }}>Retour à l'accueil</button>
              <button onClick={() => startLesson(lesson)} style={{ width: "100%", padding: "13px", borderRadius: 12, border: `1px solid ${C.border}`, background: "transparent", color: C.textSub, fontWeight: 500, fontSize: "0.85rem", cursor: "pointer", fontFamily: "'DM Sans'" }}>Recommencer</button>
            </div>
          )}

          {/* ── PROFILE ── */}
          {screen === "profile" && (
            <div style={{ maxWidth: 440, margin: "0 auto", padding: "32px 20px 90px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 26 }}>
                <div style={{ fontWeight: 700, fontSize: "1.1rem" }}>Profil</div>
                <button onClick={() => setShowSettings(true)} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "7px 13px", cursor: "pointer", fontSize: "0.75rem", color: C.textSub, fontWeight: 600, fontFamily: "'DM Sans'", display: "flex", alignItems: "center", gap: 6 }}>⚙️ Paramètres</button>
              </div>

              {showSettings && (
                <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 100, display: "flex", alignItems: "flex-end", justifyContent: "center", animation: "fadeIn 0.2s ease" }}>
                  <div style={{ background: C.surface, borderRadius: "22px 22px 0 0", padding: "28px 24px 40px", width: "100%", maxWidth: 440, border: `1px solid ${C.border}`, animation: "fadeUp 0.25s ease" }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 22 }}>
                      <div style={{ fontWeight: 700, fontSize: "1rem" }}>⚙️ Paramètres</div>
                      <button onClick={() => setShowSettings(false)} style={{ background: "none", border: "none", color: C.textMuted, fontSize: "1.2rem", cursor: "pointer", fontFamily: "'DM Sans'" }}>✕</button>
                    </div>
                    <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 14, padding: "16px 18px", marginBottom: 14 }}>
                      <div style={{ fontWeight: 600, fontSize: "0.85rem", marginBottom: 4 }}>Réinitialiser la progression</div>
                      <div style={{ fontSize: "0.73rem", color: C.textMuted, marginBottom: 14 }}>Remet à zéro tous les XP, modules et leçons complétés. Cette action est irréversible.</div>
                      <button onClick={resetProgress} style={{ width: "100%", padding: "11px", borderRadius: 10, background: C.errorDim, border: `1px solid ${C.error}`, color: C.error, fontWeight: 700, fontSize: "0.82rem", cursor: "pointer", fontFamily: "'DM Sans'" }}>🗑️ Réinitialiser toute la progression</button>
                    </div>
                  </div>
                </div>
              )}

              <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 18, padding: "22px", marginBottom: 22 }}>
                <div style={{ fontSize: "0.63rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1, marginBottom: 14 }}>STATISTIQUES</div>
                <div style={{ display: "flex" }}>
                  {[
                    { label: "XP total", value: stats.totalXP, mono: true, color: C.gold },
                    { label: "Leçons", value: stats.lessonsCompleted },
                    { label: "Modules", value: (stats.completedModules || []).length },
                  ].map((s, i) => (
                    <div key={s.label} style={{ flex: 1, textAlign: "center", borderLeft: i > 0 ? `1px solid ${C.border}` : "none", padding: "0 8px" }}>
                      <div style={{ fontSize: "1.1rem", fontWeight: 700, color: s.color || C.text, fontFamily: s.mono ? "'DM Mono'" : "inherit" }}>{s.value}</div>
                      <div style={{ fontSize: "0.6rem", color: C.textMuted, marginTop: 4 }}>{s.label}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ fontSize: "0.65rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 12 }}>Succès</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 22 }}>
                {ACHIEVEMENTS.map((a) => {
                  const unlocked = a.condition(stats);
                  return (
                    <div key={a.id} style={{ background: C.surface, border: `1px solid ${unlocked ? C.borderLight : C.border}`, borderRadius: 13, padding: "15px", opacity: unlocked ? 1 : 0.35 }}>
                      <div style={{ fontSize: "1.4rem", marginBottom: 8, filter: unlocked ? "none" : "grayscale(1)" }}>{a.emoji}</div>
                      <div style={{ fontWeight: 600, fontSize: "0.78rem" }}>{a.label}</div>
                      {unlocked && <div style={{ fontSize: "0.63rem", color: C.success, marginTop: 4, fontWeight: 600 }}>Débloqué</div>}
                    </div>
                  );
                })}
              </div>

              <div style={{ fontSize: "0.65rem", fontWeight: 600, color: C.textMuted, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 12 }}>Progression modules</div>

              <div style={{ fontSize: "0.7rem", fontWeight: 600, color: C.blue, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>🎨 Art & Culture</div>
              {ART_MODULES.map((mod) => (
                <div key={mod.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 13, padding: "13px 15px", marginBottom: 8, display: "flex", alignItems: "center", gap: 13 }}>
                  <span style={{ fontSize: "1rem" }}>{mod.emoji}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 500, fontSize: "0.78rem", marginBottom: 6 }}>{mod.title}</div>
                    <div style={{ height: 3, background: C.border, borderRadius: 999 }}>
                      <div style={{ width: moduleDone(mod.id) ? "100%" : "0%", height: "100%", background: C.blue, borderRadius: 999, transition: "width 0.5s ease" }} />
                    </div>
                  </div>
                  <span style={{ fontSize: "0.75rem", color: moduleDone(mod.id) ? C.success : C.textMuted }}>{moduleDone(mod.id) ? "✓" : "○"}</span>
                </div>
              ))}

              <div style={{ fontSize: "0.7rem", fontWeight: 600, color: C.success, marginTop: 18, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>🏛️ Histoire</div>
              {HISTORY_MODULES.map((mod) => (
                <div key={mod.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 13, padding: "13px 15px", marginBottom: 8, display: "flex", alignItems: "center", gap: 13 }}>
                  <span style={{ fontSize: "1rem" }}>{mod.emoji}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 500, fontSize: "0.78rem", marginBottom: 6 }}>{mod.title}</div>
                    <div style={{ height: 3, background: C.border, borderRadius: 999 }}>
                      <div style={{ width: moduleDone(mod.id) ? "100%" : "0%", height: "100%", background: C.success, borderRadius: 999, transition: "width 0.5s ease" }} />
                    </div>
                  </div>
                  <span style={{ fontSize: "0.75rem", color: moduleDone(mod.id) ? C.success : C.textMuted }}>{moduleDone(mod.id) ? "✓" : "○"}</span>
                </div>
              ))}

              <BottomNav screen={screen} setScreen={setScreen} C={C} />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Kulture />);
  </script>
</body>
</html>
